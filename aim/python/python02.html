<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Python in Browser</title>
</head>
<body>
  <h3>在 GitHub Pages 上运行 Python</h3>
  <textarea id="code" rows="5" cols="50">print("Hello from Python!")
1 + 1</textarea><br>
  <button id="runBtn">运行</button>
  <pre id="output">等待加载 Pyodide...</pre>

  <script>
    // 国内可访问的 Fastly 镜像
    const CDN_BASE = 'https://fastly.jsdelivr.net/pyodide/v0.25.1/full';

    let pyodide = null;
    let isLoading = false;

    async function loadPyodideLib() {
      if (window.loadPyodide) return;
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        const timeout = setTimeout(() => reject(new Error('加载超时，请检查网络')), 20000);
        script.src = `${CDN_BASE}/pyodide.js`;
        script.onload = () => { clearTimeout(timeout); resolve(); };
        script.onerror = () => { clearTimeout(timeout); reject(new Error('脚本请求失败')); };
        document.head.appendChild(script);
      });
    }

    async function initPyodide() {
      if (pyodide) return pyodide;
      if (isLoading) throw new Error('正在加载中...');

      isLoading = true;
      const output = document.getElementById('output');
      output.textContent = '正在加载 Pyodide（首次约需 10 秒）...';

      try {
        await loadPyodideLib();
        if (typeof loadPyodide === 'undefined') {
          throw new Error('loadPyodide 函数不存在');
        }
        pyodide = await loadPyodide({ indexURL: CDN_BASE });
        output.textContent = 'Pyodide 已就绪，点击运行。';
      } catch (err) {
        output.textContent = '初始化失败: ' + err.message;
        throw err;
      } finally {
        isLoading = false;
      }
      return pyodide;
    }

    document.getElementById('runBtn').addEventListener('click', async () => {
      const output = document.getElementById('output');
      try {
        const py = await initPyodide();

        let capturedOutput = '';
        py.setStdout({ batched: (msg) => { capturedOutput += msg + '\n'; } });
        py.setStderr({ batched: (msg) => { capturedOutput += 'Error: ' + msg + '\n'; } });

        const result = py.runPython(document.getElementById('code').value);
        if (result !== undefined) {
          capturedOutput += '=> ' + result + '\n';
        }
        output.textContent = capturedOutput || '(无输出)';
      } catch (err) {
        output.textContent = '运行出错: ' + err.message;
      }
    });
  </script>
</body>
</html>
