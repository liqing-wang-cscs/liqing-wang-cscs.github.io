<!-- 第1章：深度学习革命 - 自测题 -->
<div class="practice-container">
    <h1 class="practice-title">Python 的基本数据类型 - 自测题</h1>
    <p class="practice-instructions">请回答以下14道单项选择题，以帮助您学习 Python 的基本数据类型。</p>
    
    <div id="questions-container">
        <!-- 问题将通过JavaScript动态生成 -->
    </div>
</div>

<style>
    /* 只作用于本练习页内部，使用 .practice-container 限定作用域 */
    .practice-container {
        font-family: Arial, sans-serif;
        padding: 0;
        margin: 0;
    }

    .practice-container .practice-title {
        text-align: center;
        color: blue;
        font-size: 1.5rem;
        margin-top: 0;
        margin-bottom: 0.5rem;
    }

    .practice-container .practice-subtitle {
        text-align: center;
        color: blueviolet;
        font-size: 1.2rem;
        margin-bottom: 1rem;
    }

    .practice-container .practice-instructions {
        text-align: center;
        margin-bottom: 30px;
        font-style: italic;
        color: #555;
    }

    .practice-container .question-container {
        margin-bottom: 30px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background: #fff;
    }

    .practice-container .options {
        margin-top: 10px;
    }

    .practice-container .option {
        display: block;
        margin: 8px 0;
        padding: 10px;
        background-color: #f9f9f9;
        border: 1px solid #ccc;
        border-radius: 3px;
        cursor: pointer;
    }

    .practice-container .option:hover {
        background-color: #eef7ff;
    }

    .practice-container .option.correct {
        background-color: #e8f5e8 !important;
        border-color: #4CAF50 !important;
    }

    .practice-container .option.incorrect {
        background-color: #fdeeee !important;
        border-color: #f44336 !important;
    }

    .practice-container .explanation {
        margin-top: 10px;
        padding: 10px;
        background-color: #f0f8e0;
        border-left: 4px solid #4CAF50;
        display: none;
    }

    .practice-container h3 {
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 0.5rem;
    }
</style>

<!-- 引入MathJax -->
<script>
    MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        svg: { fontCache: 'global' }
    };
</script>
<script id="MathJax-script" async 
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>

<script>

    (function() {
        // 转换后的题目数据
        const questions = [
        {
            id: 1,
            topic: "整型（int）",
            question: "在 Python 3 中，表达式 7 // 2 的结果是什么？",
            options: { A: "3.5", B: "3", C: "4", D: "1" },
            answer: "B",
            explanation: "// 是整除运算符，7 // 2 向下取整得到 3。若用 / 则得到浮点数 3.5。"
        },
        {
            id: 2,
            topic: "整型（int）",
            question: "关于 Python 3 的整型，下列说法正确的是？",
            options: {
            A: "int 类型有固定上限，超出会溢出报错",
            B: "int 的位数固定为 32 位",
            C: "int 可以表示任意大小的整数，仅受内存限制",
            D: "int 与 float 运算时结果一定是 int"
            },
            answer: "C",
            explanation: "Python 3 的 int 是任意精度整数，不会像 C 语言那样固定位数溢出；与 float 运算结果通常是 float。"
        },
        {
            id: 3,
            topic: "浮点型（float）",
            question: "表达式 0.1 + 0.2 == 0.3 在 Python 中的结果是？",
            options: { A: "True", B: "False", C: "报错", D: "None" },
            answer: "B",
            explanation: "浮点数采用二进制表示，0.1 + 0.2 实际得到 0.30000000000000004，与 0.3 不完全相等，因此为 False。"
        },
        {
            id: 4,
            topic: "浮点型（float）",
            question: "下列哪个表达式的结果是 float 类型？",
            options: { A: "3 * 2", B: "8 / 4", C: "8 // 4", D: "2 ** 3" },
            answer: "B",
            explanation: "Python 3 中 / 总是返回 float，8 / 4 得到 2.0；其余表达式结果均为 int。"
        },
        {
            id: 5,
            topic: "字符串（str）",
            question: "字符串 s = \"Python\"，表达式 s[1:4] 的结果是？",
            options: { A: "Pyt", B: "yth", C: "ytho", D: "tho" },
            answer: "B",
            explanation: "切片 s[1:4] 取下标 1、2、3 的字符，即 'y'、't'、'h'，结果为 'yth'，不包含下标 4。"
        },
        {
            id: 6,
            topic: "字符串（str）",
            question: "关于 Python 字符串，下列说法正确的是？",
            options: {
            A: "字符串是可变类型，可以直接修改某个字符",
            B: "字符串可以用单引号、双引号或三引号表示",
            C: "字符串只能使用双引号表示",
            D: "字符串与整数可以直接用 + 相加"
            },
            answer: "B",
            explanation: "Python 字符串不可变，不能直接改某个字符；单引号、双引号、三引号均可表示字符串；字符串与整数用 + 会报 TypeError。"
        },
        {
            id: 7,
            topic: "布尔型（bool）",
            question: "表达式 bool([]) 的结果是？",
            options: { A: "True", B: "False", C: "报错", D: "None" },
            answer: "B",
            explanation: "空列表、空字符串、0、None 等在布尔上下文中都为 False，非空容器为 True。"
        },
        {
            id: 8,
            topic: "布尔型（bool）",
            question: "在 Python 中，True + True 的结果是？",
            options: { A: "True", B: "2", C: "False", D: "报错" },
            answer: "B",
            explanation: "bool 是 int 的子类，True 等价于 1，因此 True + True 等于 1 + 1，结果为整数 2。"
        },
        {
            id: 9,
            topic: "列表（list）",
            question: "已知 a = [1, 2, 3]，执行 a.append(4) 后，a 的值是？",
            options: { A: "[1, 2, 3]", B: "[4, 1, 2, 3]", C: "[1, 2, 3, 4]", D: "报错" },
            answer: "C",
            explanation: "append 在列表末尾追加一个元素，因此 a 变为 [1, 2, 3, 4]。"
        },
        {
            id: 10,
            topic: "列表（list）",
            question: "关于 Python 列表，下列说法正确的是？",
            options: {
            A: "列表是不可变类型，创建后不能修改元素",
            B: "列表中的元素必须是同一类型",
            C: "列表是可变类型，可以添加、删除和修改元素",
            D: "列表使用圆括号 () 定义"
            },
            answer: "C",
            explanation: "列表是可变序列，元素可以混合类型，使用方括号 [] 定义；圆括号定义的是元组。"
        },
        {
            id: 11,
            topic: "元组（tuple）",
            question: "已知 t = (1, 2, 3)，表达式 t[0] = 10 的结果是？",
            options: { A: "t 变为 (10, 2, 3)", B: "返回 10", C: "抛出 TypeError", D: "返回 None" },
            answer: "C",
            explanation: "元组是不可变类型，不支持元素赋值，执行 t[0] = 10 会抛出 TypeError。"
        },
        {
            id: 12,
            topic: "元组（tuple）",
            question: "定义只包含一个元素的元组，正确写法是？",
            options: { A: "(1)", B: "(1,)", C: "[1]", D: "{1}" },
            answer: "B",
            explanation: "(1) 只是带括号的整数 1；(1,) 才是单元素元组；[1] 是列表，{1} 是集合。"
        },
        {
            id: 13,
            topic: "字典（dict）",
            question: "已知 d = {\"a\": 1, \"b\": 2}，表达式 d[\"a\"] 的结果是？",
            options: { A: "1", B: "2", C: "\"a\"", D: "报错" },
            answer: "A",
            explanation: "字典通过键访问对应的值，d[\"a\"] 返回键 \"a\" 对应的值 1。"
        },
        {
            id: 14,
            topic: "字典（dict）",
            question: "关于 Python 字典，下列说法正确的是？",
            options: {
            A: "字典的键可以是列表",
            B: "字典中的键必须唯一",
            C: "字典是无序的，且不能通过键访问值",
            D: "字典使用方括号 [] 定义"
            },
            answer: "B",
            explanation: "字典的键必须可哈希且唯一，列表不可哈希不能作键；字典通过键访问值；字典使用花括号 {} 定义。"
        }
    ];

        function convertOptionsToArray(optionsObj) {
            return [optionsObj.A, optionsObj.B, optionsObj.C, optionsObj.D];
        }

        function getAnswerIndex(answerChar) {
            return ['A', 'B', 'C', 'D'].indexOf(answerChar);
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            if (!container) return;

            // 避免重复渲染
            if (container.dataset.rendered === 'true') return;
            container.dataset.rendered = 'true';

            questions.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question-container';

                const optionsArray = convertOptionsToArray(q.options);
                let optionsHtml = '';

                optionsArray.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label class="option" id="option-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onclick="selectOption(${index}, ${optIndex})">
                            ${String.fromCharCode(65 + optIndex)}. ${opt}
                        </label>
                    `;
                });

                qDiv.innerHTML = `
                    <h3>${index + 1}. [${q.topic}] ${q.question}</h3>
                    <div class="options">
                        ${optionsHtml}
                    </div>
                    <div id="explanation-${index}" class="explanation"></div>
                `;

                container.appendChild(qDiv);
            });

            // 渲染 MathJax
            setTimeout(() => {
                if (typeof MathJax !== 'undefined') {
                    MathJax.typeset();
                }
            }, 100);
        }

        // 暴露给全局，因为 onclick 里用到
        window.selectOption = function(questionIndex, selectedOption) {
            const question = questions[questionIndex];
            const answerIndex = getAnswerIndex(question.answer);
            const optionLabels = document.querySelectorAll(`[id^="option-${questionIndex}-"]`);

            optionLabels.forEach(label => {
                label.classList.remove('correct', 'incorrect');
            });

            if (selectedOption == answerIndex) {
                document.getElementById(`option-${questionIndex}-${selectedOption}`).classList.add('correct');
                const explanationDiv = document.getElementById(`explanation-${questionIndex}`);
                explanationDiv.innerHTML = `<strong>正确！</strong> ${question.explanation}`;
                explanationDiv.style.borderLeftColor = '#4CAF50';
                explanationDiv.style.display = 'block';
            } else {
                document.getElementById(`option-${questionIndex}-${selectedOption}`).classList.add('incorrect');
                const explanationDiv = document.getElementById(`explanation-${questionIndex}`);
                explanationDiv.innerHTML = `<strong>错误。</strong> 正确答案是 ${question.answer}: ${question.options[question.answer]}<br><br>${question.explanation}`;
                explanationDiv.style.borderLeftColor = '#f44336';
                explanationDiv.style.display = 'block';
            }

            setTimeout(() => {
                if (typeof MathJax !== 'undefined') {
                    MathJax.typeset();
                }
            }, 50);
        };

        // 立即渲染（因为这段 HTML 插入到 DOM 后，window.onload 不会再触发）
        renderQuestions();
    })();
</script>
