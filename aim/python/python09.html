<!-- NumPy ndarray 数据类型 - 自测题 -->
<div class="practice-container">
    <h1 class="practice-title">NumPy ndarray 数据类型 - 自测题</h1>
    <p class="practice-instructions">请回答以下10道单项选择题，帮助您熟悉 NumPy 的 ndarray 数据类型。</p>

    <div id="questions-container-3">
        <!-- 问题将通过JavaScript动态生成 -->
    </div>
</div>

<style>
    .practice-container {
        font-family: Arial, sans-serif;
        padding: 0;
        margin: 0;
    }

    .practice-container .practice-title {
        text-align: center;
        color: blue;
        font-size: 1.5rem;
        margin-top: 0;
        margin-bottom: 0.5rem;
    }

    .practice-container .practice-instructions {
        text-align: center;
        margin-bottom: 30px;
        font-style: italic;
        color: #555;
    }

    .practice-container .question-container {
        margin-bottom: 30px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background: #fff;
    }

    .practice-container .options {
        margin-top: 10px;
    }

    .practice-container .option {
        display: block;
        margin: 8px 0;
        padding: 10px;
        background-color: #f9f9f9;
        border: 1px solid #ccc;
        border-radius: 3px;
        cursor: pointer;
    }

    .practice-container .option:hover {
        background-color: #eef7ff;
    }

    .practice-container .option.correct {
        background-color: #e8f5e8 !important;
        border-color: #4CAF50 !important;
    }

    .practice-container .option.incorrect {
        background-color: #fdeeee !important;
        border-color: #f44336 !important;
    }

    .practice-container .explanation {
        margin-top: 10px;
        padding: 10px;
        background-color: #f0f8e0;
        border-left: 4px solid #4CAF50;
        display: none;
    }

    .practice-container h3 {
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 0.5rem;
    }
</style>

<script>
    MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        svg: { fontCache: 'global' }
    };
</script>
<script id="MathJax-script-3" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>

<script>
    (function() {
        const questions = [
        {
            id: 1,
            topic: "ndarray 创建",
            question: "执行 import numpy as np; a = np.array([1, 2, 3]) 后，a.shape 的结果是？",
            options: { A: "(3,)", B: "(1, 3)", C: "(3, 1)", D: "3" },
            answer: "A",
            explanation: "np.array([1, 2, 3]) 创建一维数组，shape 返回一个元组 (3,)，表示有 3 个元素。注意不是 (1, 3)，那是二维行向量。"
        },
        {
            id: 2,
            topic: "ndarray 创建",
            question: "执行 import numpy as np; a = np.array([[1, 2], [3, 4]]) 后，a.ndim 的结果是？",
            options: { A: "1", B: "2", C: "4", D: "(2, 2)" },
            answer: "B",
            explanation: "a 是一个 2x2 的二维数组，ndim 表示维度数，结果为 2。shape 才是 (2, 2)。"
        },
        {
            id: 3,
            topic: "ndarray 属性",
            question: "执行 import numpy as np; a = np.array([1, 2, 3]); print(a.dtype) 的输出是？",
            options: { A: "int", B: "int64", C: "float64", D: "list" },
            answer: "B",
            explanation: "整数列表创建的 ndarray 默认 dtype 是 int64（在常见 64 位平台上）。输出形如 int64。"
        },
        {
            id: 4,
            topic: "ndarray 属性",
            question: "执行 import numpy as np; a = np.array([1.5, 2.5]); print(a.dtype) 的输出是？",
            options: { A: "float", B: "float32", C: "float64", D: "int64" },
            answer: "C",
            explanation: "包含小数的列表创建的 ndarray 默认 dtype 为 float64。"
        },
        {
            id: 5,
            topic: "ndarray 创建",
            question: "执行 import numpy as np; a = np.zeros((2, 3)); print(a.shape) 的输出是？",
            options: { A: "(2,)", B: "(3,)", C: "(2, 3)", D: "(3, 2)" },
            answer: "C",
            explanation: "np.zeros((2, 3)) 创建一个 2 行 3 列的全零二维数组，shape 为 (2, 3)。"
        },
        {
            id: 6,
            topic: "ndarray 创建",
            question: "执行 import numpy as np; a = np.arange(6); print(a) 的输出是？",
            options: { A: "[1 2 3 4 5 6]", B: "[0 1 2 3 4 5]", C: "[0 1 2 3 4 5 6]", D: "报错" },
            answer: "B",
            explanation: "np.arange(6) 生成从 0 到 5（不含 6）的整数数组，即 [0 1 2 3 4 5]。"
        },
        {
            id: 7,
            topic: "ndarray 索引",
            question: "执行 import numpy as np; a = np.array([[1, 2, 3], [4, 5, 6]]); print(a[0, 2]) 的输出是？",
            options: { A: "1", B: "3", C: "4", D: "6" },
            answer: "B",
            explanation: "a[0, 2] 表示第 0 行第 2 列的元素（行列均从 0 开始），即 3。"
        },
        {
            id: 8,
            topic: "ndarray 切片",
            question: "执行 import numpy as np; a = np.array([10, 20, 30, 40, 50]); print(a[1:4]) 的输出是？",
            options: { A: "[10 20 30]", B: "[20 30 40]", C: "[20 30 40 50]", D: "[30 40 50]" },
            answer: "B",
            explanation: "切片 a[1:4] 取下标 1、2、3 的元素，不包含下标 4，结果为 [20 30 40]。"
        },
        {
            id: 9,
            topic: "ndarray 运算",
            question: "执行 import numpy as np; a = np.array([1, 2, 3]); print(a * 2) 的输出是？",
            options: { A: "[2 4 6]", B: "[1 2 3 1 2 3]", C: "[1 4 9]", D: "报错" },
            answer: "A",
            explanation: "ndarray 与标量相乘是逐元素运算，每个元素乘以 2，得到 [2 4 6]。这与列表的 * 重复拼接行为不同。"
        },
        {
            id: 10,
            topic: "ndarray 属性",
            question: "执行 import numpy as np; a = np.array([[1, 2, 3], [4, 5, 6]]); print(a.size) 的输出是？",
            options: { A: "2", B: "3", C: "6", D: "(2, 3)" },
            answer: "C",
            explanation: "size 表示数组中元素的总个数，2 行 3 列共 6 个元素。shape 才是 (2, 3)，ndim 是 2。"
        }
        ];

        function convertOptionsToArray(optionsObj) {
            return [optionsObj.A, optionsObj.B, optionsObj.C, optionsObj.D];
        }

        function getAnswerIndex(answerChar) {
            return ['A', 'B', 'C', 'D'].indexOf(answerChar);
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container-3');
            if (!container) return;
            if (container.dataset.rendered === 'true') return;
            container.dataset.rendered = 'true';

            questions.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question-container';

                const optionsArray = convertOptionsToArray(q.options);
                let optionsHtml = '';

                optionsArray.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label class="option" id="option3-${index}-${optIndex}">
                            <input type="radio" name="q3-${index}" value="${optIndex}" onclick="selectOption3(${index}, ${optIndex})">
                            ${String.fromCharCode(65 + optIndex)}. ${opt}
                        </label>
                    `;
                });

                qDiv.innerHTML = `
                    <h3>${index + 1}. [${q.topic}] ${q.question}</h3>
                    <div class="options">
                        ${optionsHtml}
                    </div>
                    <div id="explanation3-${index}" class="explanation"></div>
                `;

                container.appendChild(qDiv);
            });

            setTimeout(() => {
                if (typeof MathJax !== 'undefined') {
                    MathJax.typeset();
                }
            }, 100);
        }

        window.selectOption3 = function(questionIndex, selectedOption) {
            const question = questions[questionIndex];
            const answerIndex = getAnswerIndex(question.answer);
            const optionLabels = document.querySelectorAll(`[id^="option3-${questionIndex}-"]`);

            optionLabels.forEach(label => {
                label.classList.remove('correct', 'incorrect');
            });

            if (selectedOption == answerIndex) {
                document.getElementById(`option3-${questionIndex}-${selectedOption}`).classList.add('correct');
                const explanationDiv = document.getElementById(`explanation3-${questionIndex}`);
                explanationDiv.innerHTML = `<strong>正确！</strong> ${question.explanation}`;
                explanationDiv.style.borderLeftColor = '#4CAF50';
                explanationDiv.style.display = 'block';
            } else {
                document.getElementById(`option3-${questionIndex}-${selectedOption}`).classList.add('incorrect');
                const explanationDiv = document.getElementById(`explanation3-${questionIndex}`);
                explanationDiv.innerHTML = `<strong>错误。</strong> 正确答案是 ${question.answer}: ${question.options[question.answer]}<br><br>${question.explanation}`;
                explanationDiv.style.borderLeftColor = '#f44336';
                explanationDiv.style.display = 'block';
            }

            setTimeout(() => {
                if (typeof MathJax !== 'undefined') {
                    MathJax.typeset();
                }
            }, 50);
        };

        renderQuestions();
    })();
</script>
