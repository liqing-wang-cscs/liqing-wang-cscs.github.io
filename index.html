<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王氏数学小街</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        
        /* 使用 Flex 布局实现左右对齐 */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 15px 20px;
            background: #333;
            color: #fff;
            font-size: 18px;
            z-index: 10;
            display: flex;           /* 开启弹性盒子布局 */
            align-items: center;     /* 垂直居中对齐 */
            justify-content: space-between; /* 两端对齐（可选） */
        }
        
        /* 右侧文字自动靠右 */
        .right-text {
            margin-left: auto; 
        }

        /* 以下保持之前的样式 */
        main {
            margin-top: 60px; 
            padding: 20px;
        }
        a { display: block; margin: 10px 0; font-size: 18px; text-decoration: none; color: #0066cc; }
        /* a:hover { text-decoration: underline; } */

        /* 4. 三个大按钮样式 */
        .book-card {
            display: block;
            width: 90%;
            max-width: 200px;
            padding: 20px;
            background: #fff;
            color: #333;
            text-align: center;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, background 0.2s;
            border: 1px solid #e2e8f0;
        }
        .book-card:hover {
            transform: translateY(-3px);
            background: #f8fafc;
            border-color: #3b82f6;
            color: #3b82f6;
        }
    </style>
</head>

<body>
    <!-- 顶端固定一行：作者姓名 -->
    <header>
        <span>王氏数学小站 - 备课与教书</span>
        <!-- <span class="right-text">做数学题 · 喝茶 · 喝五谷浆糊 · 吃包子 · 喝咖啡 · 吃三明治</span> -->
    </header>
    <!-- 正文：四本教材链接 -->
    <main>
        <a href="aim/index.html" class="book-card">人工智能初学者</a>
        <a href="mme/index.html" class="book-card">数学模型与实验</a>
        <a href="tbs/index.html" class="book-card">待解决的问题</a>
        <a href="hsm/index.html" class="book-card">高中数学概念理解</a>
    </main>
</body>
</html>
