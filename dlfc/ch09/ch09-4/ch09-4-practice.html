        },
        {
            "id": 2,
            "topic": "软权重共享的动机",
            "question": "根据 9.4 节 P2--P3，Nowlan and Hinton (1992) 提出的“软权重共享 (soft weight sharing)”与硬约束参数共享有何区别？其概率模型基础是什么？",
            "options": {
            "A": "软权重共享仍强制每组权重严格相等；其概率基础是单个高斯分布",

            "A": "$\\frac{\\partial\\widetilde{E}}{\\partial w_i} = \\frac{\\partial E}{\\partial w_i} + \\lambda\\sum_j \\gamma_j(w_i)\\frac{(w_i - \\mu_j)}{\\sigma_j^2}$；效果是将每个权重拉向第 $j$ 个高斯的中心，拉力正比于该高斯对该权重的后验概率；$\\frac{\\partial\\widetilde{E}}{\\partial\\mu_j} = \\lambda\\sum_i \\gamma_j(w_i)\\frac{(\\mu_j - w_i)}{\\sigma_j^2}$；效果是将 $\\mu_j$ 推向权重值的平均值，并按后验概率加权",
            "B": "$\\frac{\\partial\\widetilde{E}}{\\partial w_i} = \\frac{\\partial E}{\\partial w_i}$；正则化项不影响权重导数",
            "C": "$\\frac{\\partial\\widetilde{E}}{\\partial \\mu_j} = 0$；高斯中心在训练中保持不变",
            "D": "$\\frac{\\partial\\widetilde{E}}{\\partial w_i} = \\lambda\\sum_j \\gamma_j(w_i)(w_i - \\mu_j)$；与方差无关"
            },
            "answer": "A",
            "explanation": "为计算导数，方便的做法是将 $\\{\\pi_j\\}$ 视为每个分量生成某个权重值的先验概率，并引入相应的后验概率（由贝叶斯定理给出）：$\\gamma_j(w_i) = \\frac{\\pi_j\\mathcal{N}(w_i|\\mu_j,\\sigma_j^2)}{\\sum_k \\pi_k\\mathcal{N}(w_i|\\mu_k,\\sigma_k^2)}$。总误差函数对权重的导数为 $\\frac{\\partial\\widetilde{E}}{\\partial w_i} = \\frac{\\partial E}{\\partial w_i} + \\lambda\\sum_j \\gamma_j(w_i)\\frac{(w_i - \\mu_j)}{\\sigma_j^2}$，效果是将每个权重拉向第 $j$ 个高斯的中心，拉力正比于该高斯对给定权重的后验概率。误差对高斯中心的导数为 $\\frac{\\partial\\widetilde{E}}{\\partial\\mu_j} = \\lambda\\sum_i \\gamma_j(w_i)\\frac{(\\mu_j - w_i)}{\\sigma_j^2}$，直观解释是它将 $\\mu_j$ 推向权重值的平均值，并按各权重参数由分量 $j$ 生成的后验概率加权。"
        },
        {
            "id": 4,
            "topic": "方差与混合系数的参数化",
            "question": "根据 9.4 节 P6--P7，为确保方差 $\\sigma_j^2$ 保持正值以及混合系数 $\\pi_j$ 满足约束 $\\sum_j \\pi_j = 1, 0 \\leq \\pi_j \\leq 1$，软权重共享分别采用了什么参数化方式？",
            "options": {
            "A": "方差直接使用 $\\sigma_j^2$，混合系数直接使用 $\\pi_j$",
            "B": "引入新变量 $\\xi_j$ 定义 $\\sigma_j^2 = \\exp(\\xi_j)$，对 $\\{\\xi_j\\}$ 进行无约束最小化；将混合系数用辅助变量 $\\{\\eta_j\\}$ 和 softmax 函数表示：$\\pi_j = \\frac{\\exp(\\eta_j)}{\\sum_k \\exp(\\eta_k)}$，此时 $\\frac{\\partial\\widetilde{E}}{\\partial\\eta_j} = \\lambda\\sum_i(\\pi_j - \\gamma_j(w_i))$，即 $\\pi_j$ 被推向混合分量 $j$ 的平均后验概率",
            "C": "方差通过取绝对值保证正值，混合系数通过归一化保证和为 1",
            "D": "方差和混合系数都不需要参数化处理"
            },
            "answer": "B",
            "explanation": "为确保方差 $\\{\\sigma_j^2\\}$ 保持正值，引入新变量 $\\{\\xi_j\\}$ 定义为 $\\sigma_j^2 = \\exp(\\xi_j)$，并对 $\\{\\xi_j\\}$ 进行无约束最小化；相应的导数为 $\\frac{\\partial\\widetilde{E}}{\\partial\\xi_j} = \\frac{\\lambda}{2}\\sum_i\\gamma_j(w_i)(1 - \\frac{(w_i-\\mu_j)^2}{\\sigma_j^2})$，这一过程驱动 $\\sigma_j$ 趋向权重围绕相应中心 $\\mu_j$ 的平方偏差的加权平均，加权系数同样是每个权重由分量 $j$ 生成的后验概率。对于混合系数 $\\pi_j$ 的导数，需考虑约束 $\\sum_j\\pi_j = 1, 0 \\leq \\pi_j \\leq 1$（这源于将 $\\pi_j$ 解释为先验概率）。可以通过 softmax 函数用辅助变量 $\\{\\eta_j\\}$ 表示：$\\pi_j = \\frac{\\exp(\\eta_j)}{\\sum_k\\exp(\\eta_k)}$，此时 $\\frac{\\partial\\widetilde{E}}{\\partial\\eta_j} = \\lambda\\sum_i(\\pi_j - \\gamma_j(w_i))$，即 $\\pi_j$ 被推向混合分量 $j$ 的平均后验概率。"

            "options": {

            "C": "该应用只适用于图像分类任务",
            "D": "该方法要求所有数据都必须带标签"
            },
            "answer": "B",
            "explanation": "Lasserre, Bishop, and Minka (2006) 提出了一种软权重共享的不同应用，引入了一种原则性方法，将生成式模型的无监督训练与相应判别式模型的有监督训练相结合。这在我们有大量无标签数据但带标签数据短缺的情形中很有用。生成式模型的优势在于所有数据都可用于确定其参数，而只有带标签样本直接为判别式模型提供信息。然而，当存在模型误设定（模型未精确描述生成数据的真实分布，这通常是常态）时，判别式模型能获得更好的泛化性能。通过对两个模型的参数引入软绑定，我们获得了生成式与判别式方法的一种良好混合形式，既能对模型误设定具有鲁棒性，又能受益于在无标签数据上进行训练。"
        }
    ];

        function convertOptionsToArray(optionsObj) {
            return [optionsObj.A, optionsObj.B, optionsObj.C, optionsObj.D];
        }

        function getAnswerIndex(answerChar) {
            return ['A', 'B', 'C', 'D'].indexOf(answerChar);
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            if (!container) return;

            // 避免重复渲染
            if (container.dataset.rendered === 'true') return;
            container.dataset.rendered = 'true';

            questions.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question-container';

                const optionsArray = convertOptionsToArray(q.options);
                let optionsHtml = '';

                optionsArray.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label class="option" id="option-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onclick="selectOption(${index}, ${optIndex})">
                            ${String.fromCharCode(65 + optIndex)}. ${opt}
                        </label>
                    `;
                });

                qDiv.innerHTML = `
                    <h3>${index + 1}. [${q.topic}] ${q.question}</h3>
                    <div class="options">
                        ${optionsHtml}
                    </div>
                    <div id="explanation-${index}" class="explanation"></div>
                `;

                container.appendChild(qDiv);
            });

            // 渲染 MathJax
            setTimeout(() => {
                if (typeof MathJax !== 'undefined') {
                    MathJax.typeset();
                }
            }, 100);
        }

        // 暴露给全局，因为 onclick 里用到
        window.selectOption = function(questionIndex, selectedOption) {
            const question = questions[questionIndex];
            const answerIndex = getAnswerIndex(question.answer);
            const optionLabels = document.querySelectorAll(`[id^="option-${questionIndex}-"]`);

            optionLabels.forEach(label => {
                label.classList.remove('correct', 'incorrect');
            });

            if (selectedOption == answerIndex) {
                document.getElementById(`option-${questionIndex}-${selectedOption}`).classList.add('correct');
                const explanationDiv = document.getElementById(`explanation-${questionIndex}`);
                explanationDiv.innerHTML = `<strong>正确！</strong> ${question.explanation}`;
                explanationDiv.style.borderLeftColor = '#4CAF50';
                explanationDiv.style.display = 'block';
            } else {
                document.getElementById(`option-${questionIndex}-${selectedOption}`).classList.add('incorrect');
                const explanationDiv = document.getElementById(`explanation-${questionIndex}`);
                explanationDiv.innerHTML = `<strong>错误。</strong> 正确答案是 ${question.answer}: ${question.options[question.answer]}<br><br>${question.explanation}`;
                explanationDiv.style.borderLeftColor = '#f44336';
                explanationDiv.style.display = 'block';
            }

            setTimeout(() => {
                if (typeof MathJax !== 'undefined') {
                    MathJax.typeset();
                }
            }, 50);
        };

        // 立即渲染（因为这段 HTML 插入到 DOM 后，window.onload 不会再触发）
        renderQuestions();
    })();
</script>
