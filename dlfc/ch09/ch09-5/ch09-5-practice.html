            "explanation": "深度神经网络表示能力很大程度源于多层处理，增加层数可显著提高泛化性能。批归一化和权重偏置的精心初始化有助于解决深层网络中梯度消失或爆炸问题，但即使有批归一化，训练层数很多的网络仍越来越困难。一种解释称为梯度碎裂 (shattered gradients)：神经网络表示能力随深度指数增长；使用 ReLU 激活函数时网络能表示的线性区域数量呈指数增长，但其后果是误差函数梯度中不连续点的激增。以单输入单输出网络为例，输出对输入的导数（即网络的雅可比）作为输入的函数被绘制出来，由链式法则这些导数决定了误差函数曲面的梯度。可以看到对深层网络而言，早期层权重参数的极小变化就能产生梯度的显著变化。迭代梯度优化算法假设梯度在参数空间中平滑变化，因此这种“梯度碎裂”效应会使极深网络的训练无效。"

        },

            "A": "残差连接使梯度对输入值更加敏感，误差曲面更陡峭",
            "B": "与标准深层网络相比，带残差连接的网络中的梯度对输入值的敏感度大大降低；Li 等人 (2017) 开发的误差曲面直接可视化方法表明，残差连接的效果是产生更平滑的误差函数曲面；通常在残差网络中会加入批归一化层，二者共同显著缓解梯度消失和爆炸问题；He 等人 (2015) 表明，加入残差连接使潜在包含数百层的极深网络能被有效训练",
            "C": "残差连接会加剧梯度消失问题",
            "D": "残差连接与批归一化不能同时使用"
            },
            "answer": "B",
            "explanation": "与标准深层网络相比，带残差连接的网络中的梯度对输入值的敏感度大大降低。Li 等人 (2017) 开发了一种直接可视化误差曲面的方法，表明残差连接的效果是产生更平滑的误差函数曲面。通常在残差网络中加入批归一化层，二者共同显著缓解梯度消失和爆炸问题。He 等人 (2015) 表明，加入残差连接使潜在包含数百层的极深网络能被有效训练。"
        },
        {
            "id": 4,
            "topic": "残差网络展开形式的含义",
            "question": "根据 9.5 节 P6，将残差网络的各层方程组合展开后（如 (9.40)），可以得到关于残差网络结构与表示能力的什么结论？",
            "options": {
            "A": "残差网络只是单一深层网络，不包含浅层子网络",
            "B": "展开后整体函数由多个并行作用的网络组成，其中包括层数较少的网络；该网络具有深层网络的表示能力（因为它将深层网络作为一个特例包含在内），但误差曲面由浅层与深层子网络的组合所调节，从而更加平滑",
            "C": "展开后残差网络无法包含任何深层子网络",
            "D": "展开后残差网络的表示能力弱于普通深层网络"
            },
            "answer": "B",
            "explanation": "将残差网络的各层方程 (9.35)--(9.37) 组合，可得到整个网络的单一总方程 $\\mathbf{y} = \\mathbf{F}_3(\\mathbf{F}_2(\\mathbf{F}_1(\\mathbf{x}) + \\mathbf{x}) + \\mathbf{z}_1) + \\mathbf{z}_2$；代入中间变量 $\\mathbf{z}_1$ 和 $\\mathbf{z}_2$ 后可得到网络输出作为输入 $\\mathbf{x}$ 的函数表达式 $\\mathbf{y} = \\mathbf{F}_3(\\mathbf{F}_2(\\mathbf{F}_1(\\mathbf{x}) + \\mathbf{x}) + \\mathbf{F}_1(\\mathbf{x}) + \\mathbf{x}) + \\mathbf{F}_2(\\mathbf{F}_1(\\mathbf{x}) + \\mathbf{x}) + \\mathbf{F}_1(\\mathbf{x}) + \\mathbf{x}$。这一展开形式表明，整体函数由多个并行作用的网络组成，其中包括层数较少的网络。该网络具有深层网络的表示能力（因为它将深层网络作为一个特例包含在内），但误差曲面由浅层和深层子网络的组合所调节，从而更加平滑。"

            "B": "残差连接要求输入和所有中间变量维度必须不同",
            "C": "残差连接不需要考虑维度匹配问题",

            },
            "answer": "B",
            "explanation": "由 (9.40) 定义的跳层连接要求输入和所有中间变量具有相同维度，以便相加。可以在网络中某些位置通过加入可学习参数的非方阵 $\\mathbf{W}$ 来改变维度：$\\mathbf{z}_i = \\mathbf{F}_i(\\mathbf{z}_{i-1}) + \\mathbf{W}\\mathbf{z}_{i-1}$。对于可学习的非线性函数 $\\mathbf{F}_i(\\cdot)$ 的具体形式，最简单的选择是标准神经网络，在可学习线性变换层与固定非线性激活函数（如 ReLU）之间交替。这开启两种放置残差连接的可能性：版本 (a) 中被相加的量总是非负的（因其为 ReLU 层输出），为允许正负值，版本 (b) 更常用。"
        }
    ];

        function convertOptionsToArray(optionsObj) {
            return [optionsObj.A, optionsObj.B, optionsObj.C, optionsObj.D];
        }

        function getAnswerIndex(answerChar) {
            return ['A', 'B', 'C', 'D'].indexOf(answerChar);
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            if (!container) return;

            // 避免重复渲染
            if (container.dataset.rendered === 'true') return;
            container.dataset.rendered = 'true';

            questions.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question-container';

                const optionsArray = convertOptionsToArray(q.options);
                let optionsHtml = '';

                optionsArray.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label class="option" id="option-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onclick="selectOption(${index}, ${optIndex})">
                            ${String.fromCharCode(65 + optIndex)}. ${opt}
                        </label>
                    `;
                });

                qDiv.innerHTML = `
                    <h3>${index + 1}. [${q.topic}] ${q.question}</h3>
                    <div class="options">
                        ${optionsHtml}
                    </div>
                    <div id="explanation-${index}" class="explanation"></div>
                `;

                container.appendChild(qDiv);
            });

            // 渲染 MathJax
            setTimeout(() => {
                if (typeof MathJax !== 'undefined') {
                    MathJax.typeset();
                }
            }, 100);
        }

        // 暴露给全局，因为 onclick 里用到
        window.selectOption = function(questionIndex, selectedOption) {
            const question = questions[questionIndex];
            const answerIndex = getAnswerIndex(question.answer);
            const optionLabels = document.querySelectorAll(`[id^="option-${questionIndex}-"]`);

            optionLabels.forEach(label => {
                label.classList.remove('correct', 'incorrect');
            });

            if (selectedOption == answerIndex) {
                document.getElementById(`option-${questionIndex}-${selectedOption}`).classList.add('correct');
                const explanationDiv = document.getElementById(`explanation-${questionIndex}`);
                explanationDiv.innerHTML = `<strong>正确！</strong> ${question.explanation}`;
                explanationDiv.style.borderLeftColor = '#4CAF50';
                explanationDiv.style.display = 'block';
            } else {
                document.getElementById(`option-${questionIndex}-${selectedOption}`).classList.add('incorrect');
                const explanationDiv = document.getElementById(`explanation-${questionIndex}`);
                explanationDiv.innerHTML = `<strong>错误。</strong> 正确答案是 ${question.answer}: ${question.options[question.answer]}<br><br>${question.explanation}`;
                explanationDiv.style.borderLeftColor = '#f44336';
                explanationDiv.style.display = 'block';
            }

            setTimeout(() => {
                if (typeof MathJax !== 'undefined') {
                    MathJax.typeset();
                }
            }, 50);
        };

        // 立即渲染（因为这段 HTML 插入到 DOM 后，window.onload 不会再触发）
        renderQuestions();
    })();
</script>
